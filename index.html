<style>
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, sans-serif; display: flex; color: #222; }
  #map { flex: 1; height: 100%; }

  #panel { width: 340px; flex: none; height: 100%; display: flex; flex-direction: column; background: #fff;
    border-right: 1px solid #ddd; box-sizing: border-box; z-index: 1001; }
  #panel > * { margin: 0 12px; }
  #sheet { margin-top: 12px; font: inherit; font-weight: 600; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  #q { margin-top: 8px; font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  #q:focus, #sheet:focus { outline: 2px solid #0288D1; outline-offset: 0; }
  #tiers { border: 0; padding: 8px 0 4px; display: grid; gap: 2px; }
  #tiers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #tiers .n { margin-left: auto; color: #666; font-variant-numeric: tabular-nums; }
  #all { justify-self: start; display: flex; gap: 16px; }
  #all[hidden], #all button[hidden] { display: none; }
  #all button { font: inherit; font-size: 13px; color: #0277BD; background: none; border: 0; padding: 2px 0; cursor: pointer; }
  #all button:hover { text-decoration: underline; }
  #all button:focus-visible { outline: 2px solid #0288D1; outline-offset: 2px; border-radius: 4px; }
  #count { color: #666; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #eee; }
  #list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #list button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px;
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  #list button:hover, #list button:focus-visible { background: #f4f8fb; }
  #list .swatch { margin-top: 5px; }
  #list .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
  #list .meta { grid-column: 2; color: #666; font-size: 12px; }
  .tag { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 8px; font-size: 11px; font-weight: 600;
    background: #FFF3C4; color: #5D4300; border: 1px solid #E6C200; vertical-align: 1px; }
  /* Yellow dot on pins of projects that are new or changed this week. */
  .badge { position: absolute; top: -6px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: #FFD600; border: 2px solid #263238; }
  #list .more { padding: 10px 12px; color: #666; font-size: 13px; }
  #toggle { display: none; }

  @media (max-width: 700px) {
    #panel { position: fixed; inset: 0 auto 0 0; width: min(calc(100vw - 72px), 340px); transform: translateX(-100%);
      transition: transform .2s; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
    #panel.open { transform: none; }
    #toggle { display: block; position: fixed; z-index: 1002; top: 10px; left: 10px; font: inherit; font-weight: 600;
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    #panel.open + #toggle { left: auto; right: 8px; top: auto; bottom: 32px; } /* clear of the zoom buttons */
    /* Bigger tap targets for the tier filters. */
    #tiers { gap: 0; }
    #tiers label { min-height: 40px; gap: 10px; font-size: 15px; }
    #tiers input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
    #tiers .swatch { width: 12px; height: 12px; }
    #all button { font-size: 15px; padding: 8px 0; }
  }

  #status { position: absolute; z-index: 1000; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #fff; padding: 6px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #status:empty { display: none; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0003; flex: none; }
  .pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: grid; place-items: center; border: 1.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); box-sizing: border-box; }
  .pin .material-symbols-outlined { transform: rotate(45deg); font-size: 17px; }
  /* Hovering a project in the list: its pin (or the bubble it's in) grows and comes to the front. */
  .pin, .marker-cluster div { transition: transform .12s ease-out; }
  .hovered .pin { transform: rotate(-45deg) scale(1.4); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.6); }
  .marker-cluster.hovered div { transform: scale(1.35); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.5); }
  .leaflet-popup-content { max-width: 320px; }
  .leaflet-popup-content h3 { margin: 0 0 6px; font-size: 15px; }
  .leaflet-popup-content dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  .leaflet-popup-content dt { color: #666; }
  .leaflet-popup-content dd { margin: 0; }
  .leaflet-popup-content .directions { display: inline-block; margin-top: 8px; font-weight: 600; }
  .leaflet-popup-content .copy { margin: 8px 0 0 14px; font: inherit; font-weight: 600; color: #0078A8; background: none; border: 0; padding: 0; cursor: pointer; }
  .leaflet-popup-content .copy:hover { text-decoration: underline; }
  #who { padding: 8px 0; border-top: 1px solid #eee; color: #666; font-size: 12px; overflow-wrap: anywhere; }
  #who button { font: inherit; color: #0277BD; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  #signin { position: fixed; z-index: 1003; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 32px));
    box-sizing: border-box; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.25); text-align: center; }
  #signin p { margin: 0 0 14px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  #filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #filters:empty { display: none; }
  #filters select { flex: 1 1 28%; min-width: 0; font: inherit; font-size: 13px; padding: 5px 4px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  #filters select:focus { outline: 2px solid #0288D1; outline-offset: 0; }
  #filters select.on { border-color: #0288D1; background: #e3f0fa; } /* a filter is narrowing the list */
  .streets { filter: saturate(.35) brightness(1.04); } /* calmer street map so the pins stand out; satellite stays true-color */
  .basemap { height: 30px; padding: 0 9px; border: 0; border-radius: 4px; background: #fff; color: #333;
    font: 600 12px system-ui, -apple-system, sans-serif; cursor: pointer; }
  .basemap:hover { background: #f4f4f4; }
  .basemap:focus-visible { outline: 2px solid #0288D1; }
  #sortrow { display: flex; align-items: center; gap: 6px; color: #666; font-size: 13px; padding-bottom: 6px; }
  #sort { flex: 1; font: inherit; color: #222; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  #sort:focus { outline: 2px solid #0288D1; outline-offset: 0; }
  #listtools { display: flex; align-items: center; gap: 8px; color: #444; font-size: 13px; padding-bottom: 6px; }
  #listtools label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #csv { margin-left: auto; font: inherit; color: #0277BD; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  #csv:disabled { color: #999; cursor: default; text-decoration: none; }
  #count .place { display: block; margin-top: 4px; font: inherit; color: #0277BD; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  #list .starred { color: #F9A825; margin-left: 4px; }
  .leaflet-popup-content .star { margin: 8px 0 0 14px; font: inherit; font-weight: 600; color: #8D6E00; background: none; border: 0; padding: 0; cursor: pointer; }
  /* Project names beside the pins once zoomed in close (the map gets class "labels"). */
  .plabel { display: none; position: absolute; left: 24px; top: 0; max-width: 170px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font: 600 11px/1.4 system-ui, -apple-system, sans-serif; color: #212121; background: rgba(255,255,255,.9);
    padding: 1px 5px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.3); pointer-events: none; }
  .labels .plabel { display: block; }
  @media (pointer: coarse) { #sort { font-size: 16px; } }
  #count .clear { margin-left: 6px; font: inherit; color: #0277BD; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .legend { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; max-width: 200px; }
  .legend summary { padding: 6px 10px; font-weight: 600; cursor: pointer; }
  .legend ul { list-style: none; margin: 0; padding: 0 10px 8px; display: grid; gap: 4px; }
  .legend li { display: flex; align-items: center; gap: 6px; }
  @media (min-width: 701px) { .legend { display: none; } } /* the side panel already shows the colors */
  /* Phones zoom the page when a text box under 16px is tapped; keep inputs at 16px on touch screens. */
  @media (pointer: coarse) { #q, #sheet, #filters select { font-size: 16px; } }
  .locate { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 4px;
    background: #fff; color: #333; cursor: pointer; }
  .locate:hover { background: #f4f4f4; }
  .locate:focus-visible { outline: 2px solid #0288D1; }
  .locate .material-symbols-outlined { font-size: 19px; }
  #list button.selected { background: #e3f0fa; box-shadow: inset 3px 0 #0288D1; }
  .pin.picked { animation: pick .5s ease-in-out 3; }
  @keyframes pick { 50% { transform: rotate(-45deg) scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .pin.picked { animation: none; outline: 3px solid #0288D1; } }
</style>

<body>
<aside id="panel" aria-label="Projects">
  <select id="sheet" aria-label="Choose sheet"></select>
  <input id="q" type="search" placeholder="Search name, contractor, address…" aria-label="Search projects" autocomplete="off" list="suggest"><datalist id="suggest"></datalist>
  <div id="filters"></div>
  <fieldset id="tiers" aria-label="Show tiers"><div id="all" hidden><button type="button" data-all="1">Select all</button><button type="button" data-all="">Deselect all</button></div></fieldset>
  <label id="sortrow">Sort <select id="sort">
    <option value="">Tier, then value</option>
    <option value="name">Name</option>
    <option value="start">Start date</option>
    <option value="near">Nearest to me</option>
  </select></label>
  <div id="listtools"><label><input type="checkbox" id="inview"> Only what's on the map</label>
    <button type="button" id="csv">Download list</button></div>
  <div id="count" aria-live="polite"></div>
  <ol id="list"></ol>
  <div id="who" hidden></div>
</aside>
<button id="toggle" type="button" aria-controls="panel" aria-expanded="false">List</button>
<div id="map"></div>
<div id="status" role="status">Loading sheet…</div>
<div id="signin" hidden role="dialog" aria-labelledby="signin-msg"><p id="signin-msg"></p><div id="gbtn"></div></div>
<script>
// Sheets in the switcher: [key used in ?sheet=, label, web app URL from that sheet's Apps Script deployment].
// The first one is the default. The web app returns only the map's columns, so the sheet itself stays private.
const SHEETS = [
  ['austin', 'Austin Metro', 'https://script.google.com/macros/s/AKfycbzihscU42IeniteZQ1geqzj5nP9cCS_qWC8AdgcdqgtVoqDOUKQtumwkUWkzqt88GW_/exec'],
  ['us',     'US',           'https://script.google.com/macros/s/AKfycbyc57-QEMwJ9cscKLCPwFnmPCPgdHCQhS9iZVeOhf0JwP20LRpxQQiBcS3XTiS0-V55/exec'],
];

const params = new URLSearchParams(location.search);
const sheet = SHEETS.find(s => s[0] === params.get('sheet')) || SHEETS[0];
// ?src= points the map at a local test file, honored only on this computer: on the live site it would let a
// crafted link send the visitor's sign-in token to someone else's server.
const local = ['localhost', '127.0.0.1'].includes(location.hostname);
const src = (local && params.get('src')) || sheet[2];
const TOKEN = 'mapToken';
const claims = t => { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return {}; } };
const fresh = t => t && claims(t).exp * 1000 > Date.now() + 60000; // a minute of slack for the round trip
// After a Google sign-in the sheet's script hands out its own 7-day pass, renewed daily, so visitors stay signed in.
// Each sheet makes its own. A pass is "<base64 {e: email, x: expiry}>.<signature>"; only the script can check the signature.
const PASS = `pass_${sheet[0]}`;
const passClaims = p => claims('.' + String(p).split('.')[0]);
const passOk = p => p && passClaims(p).x * 1000 > Date.now() + 60000;
// What to send the web app: the pass if it's still good, else a fresh Google sign-in, else null (must sign in).
const credential = () => passOk(localStorage.getItem(PASS)) ? ['pass', localStorage.getItem(PASS)]
  : fresh(localStorage.getItem(TOKEN)) ? ['token', localStorage.getItem(TOKEN)] : null;
const dataUrl = ([key, value]) => { const u = new URL(src, location.href); u.searchParams.set(key, value); return u; };
// The web app takes a few seconds to answer, so a signed-in visitor's request starts now, while the map scripts load.
const early = credential() && fetch(dataUrl(credential()));
</script>
<script id="gsi" src="https://accounts.google.com/gsi/client" async onerror="this.failed = true"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin=""></script>
<script>
// [label, pin color, icon color] — tier colors match the original My Maps, except Tier 2 is magenta, not olive, so it doesn't look like the green cluster bubbles; Facility and Contractor pins are purple and black so they stand out from the map; Completed/Cancelled is a muted blue-gray, unlike Tier 1 red and the orange clusters.
const LAYERS = [
  ['Tier 1 ($1B+)',          '#FF5252', '#fff'],
  ['Tier 2 ($500M–1B)',      '#C2185B', '#fff'],
  ['Tier 3 ($100–500M)',     '#0097A7', '#fff'],
  ['Tier 4 / No Value',      '#0288D1', '#fff'],
  ['Facility Accounts',      '#8E24AA', '#fff'],
  ['Contractors',            '#212121', '#fff'],
  ['Completed/Cancelled',    '#546E7A', '#fff'],
];

// Icon for each Category. An "Icon" column in the sheet overrides this per row.
const CATEGORY_ICONS = {
  'Data Centers': 'dns',
  'Education': 'school',
  'Government & Civic': 'account_balance',
  'Healthcare': 'local_hospital',
  'Industrial & Logistics': 'warehouse',
  'Manufacturing': 'factory',
  'Mixed Use': 'location_city',
  'Office': 'corporate_fare',
  'Power & Energy': 'bolt',
  'Residential & Hotels': 'apartment',
  'Sports & Entertainment': 'stadium',
  'Transportation': 'train',
  'Water & Utilities': 'water_drop',
  'Materials / waste / recycling': 'recycling',
  'General contractor': 'engineering',
  'Civil / earthwork / utility contractor': 'front_loader',
  'Specialty trade contractor': 'handyman',
};
// Names allowed in the sheet's Icon column (must also be in the font link above).
const ICONS = new Set(['account_balance', 'apartment', 'bed', 'bolt', 'church', 'circle', 'construction',
  'corporate_fare', 'directions_bus', 'dns', 'engineering', 'factory', 'flight', 'front_loader', 'handyman',
  'home', 'hotel', 'local_hospital', 'local_shipping', 'location_city', 'oil_barrel', 'park', 'recycling',
  'restaurant', 'school', 'science', 'shopping_cart', 'solar_power', 'stadium', 'store', 'train', 'warehouse',
  'water_drop']);

const FIELDS = ['Record Type', 'Category', 'Tier / Priority', 'Status', 'Zone', 'Address',
  'Start Date', 'End Date', 'General Contractor', 'Project Value', 'Notes'];
// Columns the search box looks in.
const SEARCH_FIELDS = ['Name', 'Address', 'Category', 'General Contractor', 'Status', 'Zone', 'Project Value', 'Notes'];
const SUGGEST_FIELDS = ['Name', 'General Contractor', 'Category', 'Zone', 'Status']; // offered as you type
const FILTERS = ['Status', 'Category', 'Zone']; // a dropdown each, when the sheet has 2+ values for it
const LIST_LIMIT = 200; // longer lists slow the panel down; the count says how many more match

function layerFor(r) {
  if (/complet|cancel/i.test(r['Status'] || '')) return 6;
  const type = (r['Record Type'] || '').toLowerCase();
  if (type.startsWith('facility')) return 4;
  if (type.startsWith('contractor')) return 5;
  const tier = r['Tier / Priority'] || '';
  return tier === 'Tier 1' ? 0 : tier === 'Tier 2' ? 1 : tier === 'Tier 3' ? 2 : 3;
}

function iconFor(r) {
  const own = (r['Icon'] || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
  return ICONS.has(own) ? own : CATEGORY_ICONS[(r['Category'] || '').trim()] || 'circle';
}

// "Nov 2026", "November 2026", "2026-11-15", "11/15/2026" → sortable number; blank or unreadable → Infinity (listed last).
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function when(s) {
  s = String(s || '').trim().toLowerCase();
  let m = /^([a-z]{3})[a-z]*\.?\s+(\d{4})$/.exec(s);
  if (m && MONTHS.includes(m[1])) return +m[2] * 12 + MONTHS.indexOf(m[1]);
  if ((m = /^(\d{4})-(\d{1,2})/.exec(s))) return +m[1] * 12 + (+m[2] - 1);
  if ((m = /^(\d{1,2})\/\d{1,2}\/(\d{4})$/.exec(s))) return +m[2] * 12 + (+m[1] - 1);
  if ((m = /^(\d{4})$/.exec(s))) return +m[1] * 12;
  return Infinity;
}

// "20B" → 2e10, "968.1M" → 9.681e8, "$1,200,000" → 1.2e6; anything else → 0. Used to sort the list.
function dollars(s) {
  const m = /([\d.,]+)\s*([KMB])?/i.exec(String(s || ''));
  if (!m) return 0;
  return (parseFloat(m[1].replace(/,/g, '')) || 0) * ({ K: 1e3, M: 1e6, B: 1e9 }[(m[2] || '').toUpperCase()] || 1);
}
// 4.2e9 → "$4.2B", 9.68e8 → "$968M", 1.2e6 → "$1.2M", 45000 → "$45K".
function money(v) {
  const [n, unit] = v >= 1e9 ? [v / 1e9, 'B'] : v >= 1e6 ? [v / 1e6, 'M'] : v >= 1e3 ? [v / 1e3, 'K'] : [v, ''];
  return '$' + (n >= 100 ? Math.round(n) : +n.toFixed(1)) + unit;
}

// Months counted like when(): this month and the Start dropdown's choices.
const thisMonth = () => new Date().getFullYear() * 12 + new Date().getMonth();
// Filters that aren't a plain column match: start-date windows and "new or updated this week".
const SPECIAL = {
  Start: (it, v) => { const w = when(it.r['Start Date']), m = thisMonth(); return v === 'started' ? w < m : w >= m && w < m + Number(v); },
  Show: (it, v) => v === 'new' ? !!it.mark : v === 'starred' ? stars.has(it.key) : true,
};
// Starred projects: kept on this device, per sheet, until unstarred (signing out keeps them).
const STARS = `stars_${sheet[0]}`;
let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem(STARS)) || []); } catch (e) { /* bad value: none starred */ }

const pinCache = {};
function pin(layer, icon, mark, name) {
  const key = [layer, icon, mark ? '*' : '', name].join('|');
  if (!pinCache[key]) {
    const [, bg, fg] = LAYERS[layer];
    pinCache[key] = L.divIcon({
      className: '', iconSize: [28, 28], iconAnchor: [14, 34], popupAnchor: [0, -32],
      html: `<div class="pin" style="background:${bg}"><span class="material-symbols-outlined" style="color:${fg}">${icon}</span></div>` +
        (mark ? '<i class="badge"></i>' : '') + (name ? `<span class="plabel">${esc(name)}</span>` : ''),
    });
  }
  return pinCache[key];
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function popup(r) {
  const rows = FIELDS.filter(f => String(r[f] || '').trim())
    .map(f => `<dt>${esc(f)}</dt><dd>${esc(r[f])}</dd>`).join('');
  const dest = encodeURIComponent(`${r.Lat},${r.Lng}`);
  return `<h3>${esc(r['Name'] || 'Untitled')}</h3><dl>${linkPhones(rows)}</dl>` +
    `<a class="directions" href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener">Directions ↗</a>` +
    (r['Address'] ? `<button type="button" class="copy" data-copy="${esc(r['Address'])}">Copy address</button>` : '') +
    `<button type="button" class="star" data-k="${esc(keyOf(r))}" aria-pressed="false">☆ Star</button>`;
}

// Turns US phone numbers (512-555-0100, (512) 555 0100, +1 512.555.0100) in escaped HTML into tap-to-call links.
const PHONE = /(?:\+?1[\s.-]?)?\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]\d{4}\b/g;
function linkPhones(html) {
  return html.replace(PHONE, m => `<a href="tel:+1${m.replace(/\D/g, '').slice(-10)}">${m}</a>`);
}

// "Near me" button under the zoom buttons: centers the map on the viewer and drops a blue dot there.
// Also used by "Sort: Nearest to me". `here` is the viewer's last known position.
let me, here;
function whereAmI() {
  if (!navigator.geolocation) { status.textContent = "This browser can't share your location."; return Promise.reject(new Error('no location')); }
  status.textContent = 'Finding your location…';
  return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(p => {
    here = L.latLng(p.coords.latitude, p.coords.longitude);
    me = me || L.circleMarker(here, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 })
      .bindTooltip('You are here').addTo(map);
    me.setLatLng(here);
    status.textContent = '';
    resolve(here);
  }, e => { status.textContent = 'Could not get your location. Allow location access for this site and try again.'; reject(e); },
  { enableHighAccuracy: true, timeout: 15000 }));
}
function locate() {
  whereAmI().then(ll => map.setView(ll, Math.max(map.getZoom(), 12)), () => {});
}
L.Control.Locate = L.Control.extend({

});

const $ = id => document.getElementById(id);

// Small screens: the panel slides over the map.
const narrow = matchMedia('(max-width: 700px)');
function setPanel(open) { panel.classList.toggle('open', open); toggle.setAttribute('aria-expanded', open); toggle.textContent = open ? 'Map' : 'List'; }
toggle.onclick = () => setPanel(!panel.classList.contains('open'));

// Accept either sheet's column names; Address may itself be "lat, lng".
const COORDS = /^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/;
function normalize(r) {
  r['Name'] = r['Name'] || r['Project Name'] || '';
  r['Tier / Priority'] = r['Tier / Priority'] || r['Tier'] || '';
  const m = !isFinite(parseFloat(r.Lat)) && COORDS.exec(r['Address'] || '');
  if (m) { r.Lat = m[1]; r.Lng = m[2]; }
  return r;
}

// Nearby pins merge into numbered bubbles that split apart as you zoom in; pins at one spot fan out on click.
const cluster = L.markerClusterGroup({ maxClusterRadius: 50, chunkedLoading: true }).addTo(map);
const tiersKey = `tiers_${sheet[0]}`; // ticked tiers, remembered per sheet on this device
let items = []; // { r, key, marker, layer, text, mark, value }
let lastListed = []; // what the list shows (all of it, not just the first LIST_LIMIT), for Download list

// Show only pins and list rows that are in a checked tier, pass every dropdown and contain every search word.
function render() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const on = LAYERS.map((_, i) => !!$('tiers').querySelector(`input[value="${i}"]:checked`));
  const picks = [...$('filters').querySelectorAll('select')].map(s => [s.dataset.f, s.value]).filter(([, v]) => v);
  const counts = LAYERS.map(() => 0);
  const shown = [], add = [], remove = [];
  for (const it of items) {
    const match = words.every(w => it.text.includes(w)) && picks.every(([f, v]) => SPECIAL[f] ? SPECIAL[f](it, v) : String(it.r[f] || '').trim() === v);
    if (match) counts[it.layer]++;
    const visible = match && on[it.layer];
    if (visible !== cluster.hasLayer(it.marker)) (visible ? add : remove).push(it.marker);
    if (visible) shown.push(it);
  }
  cluster.removeLayers(remove); // in batches: one at a time is slow with thousands of pins
  cluster.addLayers(add);
  const ticked = on.flatMap((x, i) => x ? [i] : []);
  localStorage.setItem(tiersKey, JSON.stringify(ticked));
  // Keep the view in the address bar, so copying the link shares this exact view (minus the password).
  const url = new URLSearchParams(location.search);
  const put = (k, v) => v ? url.set(k, v) : url.delete(k);
  put('tiers', ticked.join(','));
  put('q', $('q').value.trim());
  $('filters').querySelectorAll('select').forEach(s => { put(s.dataset.f.toLowerCase(), s.value); s.classList.toggle('on', !!s.value); });
  $('tiers').querySelectorAll('.n').forEach(n => { n.textContent = counts[n.dataset.i]; });
  const boxes = $('tiers').querySelectorAll('input[type=checkbox]');
  // Both links while some tiers are ticked; only the one that would change something otherwise.
  const ticks = [...boxes].filter(b => b.checked).length;
  const [selAll, deselAll] = $('all').children;
  selAll.hidden = ticks === boxes.length;
  deselAll.hidden = ticks === 0;
  const narrowed = words.length || picks.length;
  // List order: the Sort dropdown. `items` is already tier-then-value; the others re-sort a copy.
  const sort = $('sort').value;
  const miles = it => here ? here.distanceTo(it.marker.getLatLng()) / 1609.34 : 0;
  let listed = sort === 'name' ? [...shown].sort((a, b) => a.r['Name'].localeCompare(b.r['Name'], undefined, { numeric: true }))
    : sort === 'start' ? [...shown].sort((a, b) => when(a.r['Start Date']) - when(b.r['Start Date']) || a.i - b.i)
    : sort === 'near' && here ? [...shown].sort((a, b) => miles(a) - miles(b))
    : shown;
  // "Only what's on the map": the list follows the map as it moves; the pins still show every match.
  const inView = $('inview').checked;
  if (inView) { const box = map.getBounds(); listed = listed.filter(it => box.contains(it.marker.getLatLng())); }
  lastListed = listed;
  $('csv').disabled = !listed.length;
  const total = listed.reduce((sum, it) => sum + it.value, 0); // total Project Value of what's listed
  $('count').textContent = !on.some(Boolean) ? 'Select a tier to show projects.'
    : !shown.length && narrowed ? 'No projects match.'
    : inView && !listed.length ? `None of the ${shown.length} matches are on this part of the map. Zoom out or move the map.`
    : (inView ? `${listed.length} on the map here · ${shown.length} of ${items.length} match` : `${shown.length} of ${items.length} projects`) +
      (total ? ` · ${money(total)}` : '') + (listed.length > LIST_LIMIT ? ` · first ${LIST_LIMIT} listed` : '');
  if (narrowed) $('count').insertAdjacentHTML('beforeend', '<button type="button" class="clear">Clear filters</button>');
  // Nothing matches the search: offer to look it up as a place (a town or address) instead.
  if (!shown.length && words.length && on.some(Boolean)) {
    const q = $('q').value.trim();
    $('count').insertAdjacentHTML('beforeend', `<button type="button" class="place" data-q="${esc(q)}">Go to “${esc(q)}” on the map</button>`);
  }
  put('sort', sort);
  put('view', inView ? '1' : '');
  history.replaceState(null, '', '?' + url);
  $('list').innerHTML = listed.slice(0, LIST_LIMIT).map(it => {
    const meta = [sort === 'near' && here ? `${miles(it).toFixed(1)} mi` : '', sort === 'start' ? it.r['Start Date'] : '',
      it.r['Project Value'], it.r['Category']].filter(Boolean).map(esc).join(' · ');
    return `<li><button type="button" data-i="${it.i}"><span class="swatch" style="background:${LAYERS[it.layer][1]}"></span>` +
      `<span class="name">${esc(it.r['Name'] || 'Untitled')}${stars.has(it.key) ? '<span class="starred" aria-label="starred">★</span>' : ''}${it.mark ? `<span class="tag">${it.mark === 'new' ? 'New' : 'Updated'}</span>` : ''}</span>${meta ? `<span class="meta">${meta}</span>` : ''}</button></li>`;
  }).join('') + (listed.length > LIST_LIMIT ? `<li class="more">${listed.length - LIST_LIMIT} more on the map. Search to narrow the list.</li>` : '');
  return shown;
}

// Zoom to fit the given pins; maxZoom keeps a single pin from zooming in to street level.
function fit(list) {
  const bounds = L.latLngBounds(list.map(it => it.marker.getLatLng()));
  if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20], maxZoom: 14 });
}

$('list').onclick = e => {
  const btn = e.target.closest('button[data-i]');
  if (!btn) return;
  const { marker } = items[btn.dataset.i];
  $('list').querySelector('.selected')?.classList.remove('selected');

  cluster.zoomToShowLayer(marker, () => {
    marker.openPopup();
    const el = marker.getElement()?.querySelector('.pin');
    if (el) { el.classList.remove('picked'); void el.offsetWidth; el.classList.add('picked'); }
  });
};
// Hover or keyboard focus on a list row: make its pin pop out on the map (or the bubble it's in, if clustered).
let hovered;
function hover(it) {
  const m = it && cluster.getVisibleParent(it.marker); // null when the pin is filtered off the map
  if (m === hovered) return;
  if (hovered) { hovered.getElement()?.classList.remove('hovered'); hovered.setZIndexOffset(0); }
  hovered = m;
  if (m) { m.getElement()?.classList.add('hovered'); m.setZIndexOffset(1000); }
}
const rowItem = e => { const b = e.target.closest('button[data-i]'); return b && items[b.dataset.i]; };
$('list').addEventListener('mouseover', e => hover(rowItem(e)));
$('list').addEventListener('focusin', e => hover(rowItem(e)));

let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => fit(render()), 120); };
$('tiers').onchange = () => fit(render());
$('inview').onchange = () => render();
map.on('moveend', () => { if ($('inview').checked) render(); });
// Names beside the pins from street level in.
map.on('zoomend', () => map.getContainer().classList.toggle('labels', map.getZoom() >= 15));

// Download list: the listed projects as a spreadsheet (CSV) with the popup's columns.
$('csv').onclick = () => {
  const cols = ['Name', ...FIELDS, 'Lat', 'Lng'];
  const cell = v => {
    let t = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(t) && !/^-?\d+(\.\d+)?$/.test(t)) t = "'" + t; // so Excel doesn't run a cell as a formula
    return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const csv = [cols, ...lastListed.map(it => cols.map(c => it.r[c]))].map(row => row.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); // the BOM makes Excel read it as UTF-8
  a.download = `${sheet[1]} projects ${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};

// Go to a place: looks the search text up with OpenStreetMap's free place search (only when the button is pressed),
// clears the search so the projects around it show, and moves the map there.
async function findPlace(q) {
  flash(`Looking for ${q}…`);
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`);
    const [hit] = await res.json();
    if (!hit) return flash(`Couldn't find a place called ${q}.`);
    $('q').value = '';
    render();
    const [south, north, west, east] = hit.boundingbox.map(Number);
    map.fitBounds([[south, west], [north, east]], { maxZoom: 15 });
    status.textContent = '';
  } catch (err) { flash("Couldn't look up places right now."); }
}
$('filters').onchange = () => fit(render());
// Sorting only reorders the list, so the map stays put. "Nearest" asks for the location first if needed.
$('sort').onchange = () => {
  if ($('sort').value !== 'near' || here) return render();
  whereAmI().then(render, () => { $('sort').value = ''; render(); });
};
// Clears the search and dropdowns; the tier boxes stay as they are.
$('count').onclick = e => {
  const place = e.target.closest('.place');
  if (place) return findPlace(place.dataset.q);
  if (!e.target.closest('.clear')) return;
  $('q').value = '';
  $('filters').querySelectorAll('select').forEach(s => { s.value = ''; });
  fit(render());
  $('q').focus();
};
// Select all or Deselect all tiers.
$('all').onclick = e => {

  if (!btn) return;

// Sign in with Google: the web app only answers people whose email is on its sheet's Access tab.
// The sign-in token lasts about an hour and is kept on this device; returning visitors are signed in again
// automatically. CLIENT_ID is the OAuth client ID from Google Cloud; it must match the one in apps-script.gs.
const CLIENT_ID = '208947719457-p29rh0prd0g1ktbjf0obi44l45vke2re.apps.googleusercontent.com';

// The sign-in script loads in the background; only visitors who need to sign in wait for it.
const gsiReady = new Promise((ok, fail) => {
  if (window.google?.accounts?.id) return ok();
  if ($('gsi').failed) return fail(new Error('no google')); // failed before this script ran
  $('gsi').addEventListener('load', ok);
  $('gsi').addEventListener('error', () => fail(new Error('no google')));
});
gsiReady.then(() => google.accounts.id.initialize({
  client_id: CLIENT_ID, auto_select: true,
  callback: r => { localStorage.setItem(TOKEN, r.credential); $('signin').hidden = true; gotToken?.(r.credential); },
}), () => {});

let gotToken;
async function signIn(message) {
  await gsiReady;
  return new Promise(resolve => {
    gotToken = t => { status.textContent = 'Loading sheet…'; resolve(t); };
    status.textContent = '';
    $('signin-msg').textContent = message;
    $('signin').hidden = false;
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
    google.accounts.id.prompt(); // one-tap: signs a returning visitor straight back in
  });
}

async function getData(message, first) {
  let req = first && early; // the request already started at the top of the page
  if (!req) req = fetch(dataUrl(credential() || ['token', await signIn(message)]));
  const res = await req;
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  if (data?.error) {
    localStorage.removeItem(TOKEN);
    forgetSaved();
    if (savedReply) { location.reload(); return new Promise(() => {}); } // take the saved copy off the screen too
    if (data.error === 'not allowed') {
      window.google?.accounts.id.disableAutoSelect(); // let them pick another account instead of looping
      return getData(`${data.email} doesn't have access to the ${sheet[1]} map. Ask the map's owner to add it, or sign in with another account.`);
    }
    return getData('Please sign in again.');
  }
  if (data.pass) { localStorage.setItem(PASS, data.pass); delete data.pass; } // a new or renewed pass
  const email = passClaims(localStorage.getItem(PASS)).e || claims(localStorage.getItem(TOKEN)).email;
  $('who').innerHTML = `<span id="age"></span>Signed in as ${esc(email)} · <button type="button" id="signout">Sign out</button>`;
  $('who').hidden = false;
  $('signout').onclick = () => { localStorage.removeItem(TOKEN); forgetSaved(); window.google?.accounts.id.disableAutoSelect(); location.reload(); };
  return data;
}

// "Data as of 3 min ago": the web app caches the sheet for up to 10 minutes, so say how old this copy is.
function showAge(updated) {
  if (!$('age')) return; // the saved copy is drawn before the sign-in line exists
  const mins = Math.floor((Date.now() - updated) / 60000);
  $('age').textContent = `Data as of ${mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : new Date(updated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · `;
}

// The last copy of this sheet's data stays on the device, so a signed-in visitor sees the map at once; the sheet's
// answer replaces it a few seconds later if anything changed. Signing out or losing access deletes it.
const SAVED = `data_${sheet[0]}`;
// Saved copies, passes and change marks for every sheet.
const forgetSaved = () => Object.keys(localStorage).filter(k => /^(data|pass|changes)_/.test(k)).forEach(k => localStorage.removeItem(k));

// "New" and "Updated" marks: each time the sheet answers, its rows are compared with the copy saved last time.
// A project that wasn't there is new; one whose columns changed is updated. Marks last a week on this device.
const CHANGES = `changes_${sheet[0]}`, MARK_DAYS = 7;
const keyOf = r => `${r['Name'] || r['Project Name'] || ''}|${r['Address'] || ''}`;
function loadMarks() {
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(CHANGES)) || {}; } catch (e) { /* bad value: start over */ }
  for (const k in marks) if (Date.now() - marks[k][1] > MARK_DAYS * 86400000) delete marks[k];
  return marks; // { key: ['new' | 'updated', when noticed] }
}
function noteChanges(before, rows) {
  const marks = loadMarks();
  if (!Array.isArray(before) || !before.length || !Array.isArray(rows)) return; // first load on this device: nothing to compare
  const old = new Map(before.map(r => [keyOf(r), JSON.stringify(r)]));
  for (const r of rows) {
    const k = keyOf(r), was = old.get(k);
    if (was === undefined) marks[k] = ['new', Date.now()];
    else if (was !== JSON.stringify(r) && marks[k]?.[0] !== 'new') marks[k] = ['updated', Date.now()];
  }
  try { localStorage.setItem(CHANGES, JSON.stringify(marks)); } catch (e) { /* storage full: skip the marks */ }
}
const rowsOf = reply => Array.isArray(reply) ? reply : reply?.rows; // newer sheet scripts send { updated, rows }, older just rows
let savedReply = null;
if (early) try { savedReply = JSON.parse(localStorage.getItem(SAVED)); } catch (e) { /* bad copy: ignore it */ }

let ageTimer, legend;
function trackAge(reply) {
  clearInterval(ageTimer);
  if (reply?.updated) { showAge(reply.updated); ageTimer = setInterval(() => showAge(reply.updated), 60000); }
}

// The Start and Show dropdowns, each only when it would do something.
const menu = (f, label, opts, cur) => `<select data-f="${f}" aria-label="${label}">` + opts.map(([v, text]) =>
  `<option value="${v}"${v && v === cur ? ' selected' : ''}>${text}</option>`).join('') + '</select>';
function showMenu(cur) {
  const changed = items.filter(it => it.mark).length, starred = items.filter(it => stars.has(it.key)).length;
  if (!changed && !starred) return '';
  return menu('Show', 'Show only new or starred projects', [['', 'Any project'],
    ...(changed ? [['new', `New or updated (${changed})`]] : []), ...(starred ? [['starred', `Starred (${starred})`]] : [])], cur);
}
function special(params) {
  return (items.some(it => isFinite(when(it.r['Start Date']))) ? menu('Start', 'Filter by start date', [['', 'Any start'],
    ['3', 'Starts within 3 months'], ['6', 'Starts within 6 months'], ['12', 'Starts within 12 months'], ['started', 'Already started']],
    params.get('start')) : '') + showMenu(params.get('show'));
}
// After starring or unstarring: update the Show dropdown's counts (it appears with the first star) and the list.
function refreshShowMenu() {
  const old = $('filters').querySelector('[data-f="Show"]');
  const html = showMenu(old?.value || '');
  if (old) old.outerHTML = html; else $('filters').insertAdjacentHTML('beforeend', html);
  render();
}

// Builds the pins, list and filters from the sheet's rows. `again`: replacing the saved copy, so keep the
// visitor's current view (the address bar follows it) and don't move the map.
function show(reply, again) {
  const data = rowsOf(reply);
  trackAge(reply);
  if (!Array.isArray(data) || !data.length || !('Address' in data[0])) {
    status.textContent = 'The sheet returned no projects. Check its Master tab has an Address column.';
    return;
  }
  if (again) { cluster.clearLayers(); legend?.remove(); $('tiers').querySelectorAll('label').forEach(l => l.remove()); }
  const params = new URLSearchParams(location.search);
  items = [];
  const marks = loadMarks();
  let missing = 0;
  for (const r of data.map(normalize)) {
    const lat = parseFloat(r.Lat), lng = parseFloat(r.Lng);
    if (!isFinite(lat) || !isFinite(lng)) { missing++; continue; }
    const key = keyOf(r), layer = layerFor(r), mark = marks[key]?.[0];
    const marker = L.marker([lat, lng], { icon: pin(layer, iconFor(r), mark, r['Name']), title: r['Name'] || '' }).bindPopup(popup(r));
    const text = SEARCH_FIELDS.map(f => r[f] || '').join(' ').toLowerCase();
    items.push({ r, key, marker, layer, text, mark, value: dollars(r['Project Value']) });
  }
  // List order: tier, then biggest project value first.
  items.sort((a, b) => a.layer - b.layer || b.value - a.value || a.r['Name'].localeCompare(b.r['Name']));
  items.forEach((it, i) => { it.i = i; });
  const suggestions = new Set(items.flatMap(it => SUGGEST_FIELDS.map(f => String(it.r[f] || '').trim())).filter(Boolean));
  $('suggest').innerHTML = [...suggestions].sort().map(s => `<option value="${esc(s)}">`).join('');

  // One checkbox per tier that has rows (e.g. the US sheet has no facilities or contractors).
  // First visit: all unchecked, so the map is empty until a tier is picked. After that, the last ticked tiers.
  // A shared link (?tiers=0,2) wins over what this device remembers.
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(tiersKey)) || []; } catch (e) { /* bad value: start empty */ }
  if (params.has('tiers')) saved = params.get('tiers').split(',').filter(Boolean).map(Number);
  $('q').value = params.get('q') || '';
  if ([...$('sort').options].some(o => o.value && o.value === params.get('sort'))) $('sort').value = params.get('sort');
  $('inview').checked = params.get('view') === '1';
  $('filters').innerHTML = FILTERS.map(f => {
    const vals = [...new Set(items.map(it => String(it.r[f] || '').trim()).filter(Boolean))].sort();
    if (vals.length < 2) return '';
    const cur = params.get(f.toLowerCase());
    return `<select data-f="${esc(f)}" aria-label="Filter by ${esc(f.toLowerCase())}"><option value="">Any ${esc(f.toLowerCase())}</option>` +
      vals.map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('') + '</select>';
  }).join('') + special(params);
  $('tiers').insertAdjacentHTML('beforeend', LAYERS.map(([label, color], i) =>
    items.some(it => it.layer === i) ? `<label><input type="checkbox" value="${i}"${saved.includes(i) ? ' checked' : ''}>` +
      `<span class="swatch" style="background:${color}"></span>${esc(label)}<span class="n" data-i="${i}"></span></label>` : '').join(''));
  $('all').hidden = false;
  // Phones: a collapsible color key on the map, since the panel with the swatches is usually closed.
  const Legend = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd() {
      const box = L.DomUtil.create('details', 'legend');
      box.innerHTML = '<summary>Key</summary><ul>' + LAYERS.map(([label, color], i) => items.some(it => it.layer === i)
        ? `<li><span class="swatch" style="background:${color}"></span>${esc(label)}</li>` : '').join('') + '</ul>';
      L.DomEvent.disableClickPropagation(box);
      return box;
    },
  });
  legend = new Legend().addTo(map);
  const shown = render();
  if (!again) {
    fit(shown.length ? shown : items); // nothing ticked: still frame the sheet's area
    if ($('sort').value === 'near') $('sort').onchange(); // a shared "nearest" link: get this viewer's location
    // On a phone an empty map gives no clue what to do, so open the panel with the tier boxes.
    if (!shown.length && narrow.matches) setPanel(true);
  }
  status.textContent = missing ? `${missing} of ${data.length} rows have no Lat/Lng yet. Run Map → Fill coordinates in the sheet.` : '';
}

if (savedReply) show(savedReply);
// Offline use: sw.js keeps the page, map code and viewed tiles (not the data, which has its own saved copy).
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
getData(`Sign in with Google to see the ${sheet[1]} map.`, true)
  .then(reply => {
    let before = null;
    try { before = rowsOf(JSON.parse(localStorage.getItem(SAVED))); } catch (e) { /* no usable copy */ }
    noteChanges(before, rowsOf(reply));
    try { localStorage.setItem(SAVED, JSON.stringify(reply)); }
    catch (e) { localStorage.removeItem(SAVED); } // too big for this device's storage: just don't keep a copy
    if (savedReply && JSON.stringify(rowsOf(savedReply)) === JSON.stringify(rowsOf(reply))) trackAge(reply);
    else show(reply, !!savedReply);
  })
  // A web app error comes back as an HTML page, so res.json() lands here too.
  .catch(err => {
    if (savedReply) { status.textContent = "Couldn't reach the sheet, so this is the copy saved on this device."; return; }
    status.textContent = err.message === 'no google' ? 'Could not load Google sign-in. Check your connection or turn off blockers for this site, then reload.'
      : 'Could not load the sheet. Is its web app deployed with access "Anyone"?';
  });
</script>
</body>
</html>
