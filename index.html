<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="">
<!-- Only the icons in ICONS below are downloaded. Keep this list in sync with ICONS (alphabetical). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=account_balance,apartment,bed,bolt,church,circle,construction,corporate_fare,directions_bus,dns,engineering,factory,flight,front_loader,handyman,home,hotel,local_hospital,local_shipping,location_city,oil_barrel,park,recycling,restaurant,school,science,shopping_cart,solar_power,stadium,store,train,warehouse,water_drop&display=block">
<style>
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, sans-serif; display: flex; color: #222; }
  #map { flex: 1; height: 100%; }

  #panel { width: 340px; flex: none; height: 100%; display: flex; flex-direction: column; background: #fff;
    border-right: 1px solid #ddd; box-sizing: border-box; z-index: 1001; }
  #panel > * { margin: 0 12px; }
  #sheet { margin-top: 12px; font: inherit; font-weight: 600; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  #q { margin-top: 8px; font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  #q:focus, #sheet:focus { outline: 2px solid #0288D1; outline-offset: 0; }
  #tiers { border: 0; padding: 8px 0 4px; display: grid; gap: 2px; }
  #tiers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #tiers .n { margin-left: auto; color: #666; font-variant-numeric: tabular-nums; }
  #all { justify-self: start; font: inherit; font-size: 13px; color: #0277BD; background: none; border: 0; padding: 2px 0; cursor: pointer; }
  #all:hover { text-decoration: underline; }
  #all:focus-visible { outline: 2px solid #0288D1; outline-offset: 2px; border-radius: 4px; }
  #count { color: #666; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #eee; }
  #list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #list button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px;
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  #list button:hover, #list button:focus-visible { background: #f4f8fb; }
  #list .swatch { margin-top: 5px; }
  #list .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
  #list .meta { grid-column: 2; color: #666; font-size: 12px; }
  #list .more { padding: 10px 12px; color: #666; font-size: 13px; }
  #toggle { display: none; }

  @media (max-width: 700px) {
    #panel { position: fixed; inset: 0 auto 0 0; width: min(calc(100vw - 72px), 340px); transform: translateX(-100%);
      transition: transform .2s; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
    #panel.open { transform: none; }
    #toggle { display: block; position: fixed; z-index: 1002; top: 10px; left: 10px; font: inherit; font-weight: 600;
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    #panel.open + #toggle { left: auto; right: 8px; top: auto; bottom: 32px; } /* clear of the zoom buttons */
    /* Bigger tap targets for the tier filters. */
    #tiers { gap: 0; }
    #tiers label { min-height: 40px; gap: 10px; font-size: 15px; }
    #tiers input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
    #tiers .swatch { width: 12px; height: 12px; }
    #all { font-size: 15px; padding: 8px 0; }
  }

  #status { position: absolute; z-index: 1000; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #fff; padding: 6px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #status:empty { display: none; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0003; flex: none; }
  .pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: grid; place-items: center; border: 1.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); box-sizing: border-box; }
  .pin .material-symbols-outlined { transform: rotate(45deg); font-size: 17px; }
  .leaflet-popup-content { max-width: 320px; }
  .leaflet-popup-content h3 { margin: 0 0 6px; font-size: 15px; }
  .leaflet-popup-content dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
  .leaflet-popup-content dt { color: #666; }
  .leaflet-popup-content dd { margin: 0; }
</style>
</head>
<body>
<aside id="panel" aria-label="Projects">
  <select id="sheet" aria-label="Choose sheet"></select>
  <input id="q" type="search" placeholder="Search name, contractor, address…" aria-label="Search projects" autocomplete="off">
  <fieldset id="tiers" aria-label="Show tiers"><button id="all" type="button" hidden>Deselect all</button></fieldset>
  <div id="count" aria-live="polite"></div>
  <ol id="list"></ol>
</aside>
<button id="toggle" type="button" aria-controls="panel" aria-expanded="false">List</button>
<div id="map"></div>
<div id="status" role="status">Loading sheet…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
<script>
// Sheets in the switcher: [key used in ?sheet=, label, web app URL from that sheet's Apps Script deployment].
// The first one is the default. The web app returns only the map's columns, so the sheet itself stays private.
const SHEETS = [
  ['austin', 'Austin Metro', 'https://script.google.com/macros/s/AKfycbw2MlHBmuSZD5E-EsFiYWepOEqvryS6CUNzRMEpRWnSMvvwcDjvDF0VW-g5N9V78qm6/exec'],
  ['us',     'US',           'https://script.google.com/macros/s/AKfycbyR0B6pg8n0XhYRAo2WJjqVnCmxNHezoo-0iVOxFu6S9fJRGme3BrWJG6OZ9Lq8OnDu/exec'],
];

// [label, pin color, icon color] — pin colors match the original My Maps.
const LAYERS = [
  ['Tier 1 ($1B+)',          '#FF5252', '#fff'],
  ['Tier 2 ($500M–1B)',      '#AFB42B', '#fff'],
  ['Tier 3 ($100–500M)',     '#0097A7', '#fff'],
  ['Tier 4 / No Value',      '#0288D1', '#fff'],
  ['Facility Accounts',      '#BDBDBD', '#333'],
  ['Contractors',            '#757575', '#fff'],
  ['Completed/Cancelled',    '#E65100', '#fff'],
];

// Icon for each Category. An "Icon" column in the sheet overrides this per row.
const CATEGORY_ICONS = {
  'Data Centers': 'dns',
  'Education': 'school',
  'Government & Civic': 'account_balance',
  'Healthcare': 'local_hospital',
  'Industrial & Logistics': 'warehouse',
  'Manufacturing': 'factory',
  'Mixed Use': 'location_city',
  'Office': 'corporate_fare',
  'Power & Energy': 'bolt',
  'Residential & Hotels': 'apartment',
  'Sports & Entertainment': 'stadium',
  'Transportation': 'train',
  'Water & Utilities': 'water_drop',
  'Materials / waste / recycling': 'recycling',
  'General contractor': 'engineering',
  'Civil / earthwork / utility contractor': 'front_loader',
  'Specialty trade contractor': 'handyman',
};
// Names allowed in the sheet's Icon column (must also be in the font link above).
const ICONS = new Set(['account_balance', 'apartment', 'bed', 'bolt', 'church', 'circle', 'construction',
  'corporate_fare', 'directions_bus', 'dns', 'engineering', 'factory', 'flight', 'front_loader', 'handyman',
  'home', 'hotel', 'local_hospital', 'local_shipping', 'location_city', 'oil_barrel', 'park', 'recycling',
  'restaurant', 'school', 'science', 'shopping_cart', 'solar_power', 'stadium', 'store', 'train', 'warehouse',
  'water_drop']);

const FIELDS = ['Record Type', 'Category', 'Tier / Priority', 'Status', 'Zone', 'Address',
  'Start Date', 'End Date', 'General Contractor', 'Project Value', 'Notes'];
// Columns the search box looks in.
const SEARCH_FIELDS = ['Name', 'Address', 'Category', 'General Contractor', 'Status', 'Zone', 'Project Value', 'Notes'];
const LIST_LIMIT = 200; // longer lists slow the panel down; the count says how many more match

function layerFor(r) {
  if (/complet|cancel/i.test(r['Status'] || '')) return 6;
  const type = (r['Record Type'] || '').toLowerCase();
  if (type.startsWith('facility')) return 4;
  if (type.startsWith('contractor')) return 5;
  const tier = r['Tier / Priority'] || '';
  return tier === 'Tier 1' ? 0 : tier === 'Tier 2' ? 1 : tier === 'Tier 3' ? 2 : 3;
}

function iconFor(r) {
  const own = (r['Icon'] || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
  return ICONS.has(own) ? own : CATEGORY_ICONS[(r['Category'] || '').trim()] || 'circle';
}

// "20B" → 2e10, "968.1M" → 9.681e8, "$1,200,000" → 1.2e6; anything else → 0. Used to sort the list.
function dollars(s) {
  const m = /([\d.,]+)\s*([KMB])?/i.exec(String(s || ''));
  if (!m) return 0;
  return (parseFloat(m[1].replace(/,/g, '')) || 0) * ({ K: 1e3, M: 1e6, B: 1e9 }[(m[2] || '').toUpperCase()] || 1);
}

const pinCache = {};
function pin(layer, icon) {
  const key = layer + icon;
  if (!pinCache[key]) {
    const [, bg, fg] = LAYERS[layer];
    pinCache[key] = L.divIcon({
      className: '', iconSize: [28, 28], iconAnchor: [14, 34], popupAnchor: [0, -32],
      html: `<div class="pin" style="background:${bg}"><span class="material-symbols-outlined" style="color:${fg}">${icon}</span></div>`,
    });
  }
  return pinCache[key];
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function popup(r) {
  const rows = FIELDS.filter(f => String(r[f] || '').trim())
    .map(f => `<dt>${esc(f)}</dt><dd>${esc(r[f])}</dd>`).join('');
  return `<h3>${esc(r['Name'] || 'Untitled')}</h3><dl>${rows}</dl>`;
}

const map = L.map('map', { zoomControl: false }).setView([30.45, -97.52], 10);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19,
}).addTo(map);

const $ = id => document.getElementById(id);
const status = $('status'), panel = $('panel'), toggle = $('toggle');
const params = new URLSearchParams(location.search);
const sheet = SHEETS.find(s => s[0] === params.get('sheet')) || SHEETS[0];
const src = params.get('src') || sheet[2]; // ?src= lets you test with a local JSON file
document.title = `${sheet[1]} Projects Map`;

// Sheet switcher: reloads the page with ?sheet=<key>, so each view has its own shareable link.
$('sheet').innerHTML = SHEETS.map(s => `<option value="${s[0]}"${s === sheet ? ' selected' : ''}>${esc(s[1])}</option>`).join('');
$('sheet').onchange = e => { params.set('sheet', e.target.value); location.search = params; };

// Small screens: the panel slides over the map.
const narrow = matchMedia('(max-width: 700px)');
function setPanel(open) { panel.classList.toggle('open', open); toggle.setAttribute('aria-expanded', open); toggle.textContent = open ? 'Map' : 'List'; }
toggle.onclick = () => setPanel(!panel.classList.contains('open'));

// Accept either sheet's column names; Address may itself be "lat, lng".
const COORDS = /^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/;
function normalize(r) {
  r['Name'] = r['Name'] || r['Project Name'] || '';
  r['Tier / Priority'] = r['Tier / Priority'] || r['Tier'] || '';
  const m = !isFinite(parseFloat(r.Lat)) && COORDS.exec(r['Address'] || '');
  if (m) { r.Lat = m[1]; r.Lng = m[2]; }
  return r;
}

const groups = LAYERS.map(() => L.featureGroup().addTo(map));
let items = []; // { r, marker, layer, text, value }

// Show only pins and list rows that are in a checked tier and contain every search word.
function render() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const on = LAYERS.map((_, i) => !!$('tiers').querySelector(`input[value="${i}"]:checked`));
  const counts = LAYERS.map(() => 0);
  const shown = [];
  for (const it of items) {
    const match = words.every(w => it.text.includes(w));
    if (match) counts[it.layer]++;
    const visible = match && on[it.layer];
    if (visible !== groups[it.layer].hasLayer(it.marker)) groups[it.layer][visible ? 'addLayer' : 'removeLayer'](it.marker);
    if (visible) shown.push(it);
  }
  $('tiers').querySelectorAll('.n').forEach(n => { n.textContent = counts[n.dataset.i]; });
  const boxes = $('tiers').querySelectorAll('input[type=checkbox]');
  $('all').textContent = [...boxes].every(b => b.checked) ? 'Deselect all' : 'Select all';
  $('count').textContent = !on.some(Boolean) ? 'Select a tier to show projects.'
    : `${shown.length} of ${items.length} projects` + (shown.length > LIST_LIMIT ? ` · first ${LIST_LIMIT} listed` : '');
  $('list').innerHTML = shown.slice(0, LIST_LIMIT).map(it => {
    const meta = [it.r['Project Value'], it.r['Category']].filter(Boolean).map(esc).join(' · ');
    return `<li><button type="button" data-i="${it.i}"><span class="swatch" style="background:${LAYERS[it.layer][1]}"></span>` +
      `<span class="name">${esc(it.r['Name'] || 'Untitled')}</span>${meta ? `<span class="meta">${meta}</span>` : ''}</button></li>`;
  }).join('') + (shown.length > LIST_LIMIT ? `<li class="more">${shown.length - LIST_LIMIT} more on the map. Search to narrow the list.</li>` : '');
  return shown;
}

// Zoom to fit the given pins; maxZoom keeps a single pin from zooming in to street level.
function fit(list) {
  const bounds = L.featureGroup(list.map(it => it.marker)).getBounds();
  if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20], maxZoom: 14 });
}

$('list').onclick = e => {
  const btn = e.target.closest('button[data-i]');
  if (!btn) return;
  const { marker } = items[btn.dataset.i];
  if (narrow.matches) setPanel(false);
  map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14));
  marker.openPopup();
};
let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(render, 120); };
$('tiers').onchange = () => fit(render());
// Select all tiers, or deselect all when every tier is already checked.
$('all').onclick = () => {
  const boxes = [...$('tiers').querySelectorAll('input[type=checkbox]')];
  const check = !boxes.every(b => b.checked);
  boxes.forEach(b => { b.checked = check; });
  fit(render());
};

// The web app wants the sheet's map password; it's asked once and remembered on this device.
// shortcut: prompt() shows the password as typed, swap for a password form if that matters.
const keyName = `mapKey_${sheet[0]}`;
function getData(question) {
  const key = localStorage.getItem(keyName) || prompt(question);
  if (!key) return Promise.reject(new Error('no password'));
  const url = new URL(src, location.href);
  url.searchParams.set('key', key);
  return fetch(url)
    .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(data => {
      if (data && data.error) { localStorage.removeItem(keyName); return getData(`Wrong password. Password for the ${sheet[1]} map:`); }
      localStorage.setItem(keyName, key);
      return data;
    });
}

getData(`Password for the ${sheet[1]} map:`)
  .then(data => {
    if (!Array.isArray(data) || !data.length || !('Address' in data[0])) {
      status.textContent = 'The sheet returned no projects. Check its Master tab has an Address column.';
      return;
    }
    let missing = 0;
    for (const r of data.map(normalize)) {
      const lat = parseFloat(r.Lat), lng = parseFloat(r.Lng);
      if (!isFinite(lat) || !isFinite(lng)) { missing++; continue; }
      const layer = layerFor(r);
      const marker = L.marker([lat, lng], { icon: pin(layer, iconFor(r)), title: r['Name'] || '' }).bindPopup(popup(r));
      const text = SEARCH_FIELDS.map(f => r[f] || '').join(' ').toLowerCase();
      items.push({ r, marker, layer, text, value: dollars(r['Project Value']) });
    }
    // List order: tier, then biggest project value first.
    items.sort((a, b) => a.layer - b.layer || b.value - a.value || a.r['Name'].localeCompare(b.r['Name']));
    items.forEach((it, i) => { it.i = i; });

    // One checkbox per tier that has rows (e.g. the US sheet has no facilities or contractors).
    // All start unchecked: the map is empty until a tier is picked.
    $('tiers').insertAdjacentHTML('beforeend', LAYERS.map(([label, color], i) =>
      items.some(it => it.layer === i) ? `<label><input type="checkbox" value="${i}">` +
        `<span class="swatch" style="background:${color}"></span>${esc(label)}<span class="n" data-i="${i}"></span></label>` : '').join(''));
    $('all').hidden = false;
    render();
    fit(items); // frame the sheet's area even though no pins show yet
    status.textContent = missing ? `${missing} of ${data.length} rows have no Lat/Lng yet. Run Map → Fill coordinates in the sheet.` : '';
  })
  // A web app error comes back as an HTML page, so res.json() lands here too.
  .catch(err => {
    status.textContent = err.message === 'no password' ? 'This map needs a password. Reload the page to enter it.'
      : 'Could not load the sheet. Is its web app deployed with access "Anyone"?';
  });
</script>
</body>
</html>
